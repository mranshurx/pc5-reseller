<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PC5 Keys — Reseller Panel</title>
<meta name="robots" content="noindex" />
<style>
:root{
  --bg:#07090e; --bg2:#0c1018; --line:#1c2431; --line2:#2a3444;
  --txt:#e6ebf4; --dim:#8b98ab; --acc:#7c5cff; --acc2:#22d3ee;
  --ok:#2ecc71; --err:#ff5470; --warn:#f0b429; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(124,92,255,.20), transparent 60%),
    radial-gradient(800px 460px at 92% 0%, rgba(34,211,238,.14), transparent 55%),
    var(--bg);
  color:var(--txt);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
body.busy{cursor:progress}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:rgba(7,9,14,.75);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand em{font-style:normal;color:var(--dim);font-weight:600}
.brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(124,92,255,.75)}
.nav{display:flex;gap:6px}
.nav a{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim);border:1px solid transparent}
.nav a:hover{color:var(--txt)}
.nav a.on{color:var(--txt);border-color:var(--line2);background:var(--bg2)}
main{flex:1;padding:34px 0 60px}
.hero{padding:26px 0 24px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.12;letter-spacing:-.03em;margin:0 0 10px;font-weight:800}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:22px 0 9px}
.grad{background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 14px}
.hint{color:var(--dim);font-size:12px;font-weight:400}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card.narrow{max-width:400px}
.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.authgrid{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:12px 0 6px;letter-spacing:.02em}
input,select{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);background:#0a0e15;color:var(--txt);font-size:14px;outline:none;font-family:inherit}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.16)}
.inline{display:flex;gap:9px;flex-wrap:wrap}
.inline input{flex:1;min-width:190px}
.btn{padding:10px 15px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--txt);font-weight:650;font-size:13.5px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(100deg,var(--acc),#5b8bff);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--err);border-color:rgba(255,84,112,.4)}
.btn.tiny{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[type=submit]{margin-top:14px;width:100%}
.inline .btn[type=submit]{margin-top:0;width:auto}
.rowhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.rowhead.tight{margin-bottom:10px;align-items:center}
.rowhead-actions{display:flex;gap:8px}
.toggles{display:flex;gap:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line2);color:var(--dim);background:#0b0f16}
.badge.ok{color:var(--ok);border-color:rgba(46,204,113,.35)}
.badge.warn{color:var(--warn);border-color:rgba(240,180,41,.35)}
.badge.err{color:var(--err);border-color:rgba(255,84,112,.35)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.plan{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:13px;border-radius:11px;border:1px solid var(--line2);background:#0a0e15;cursor:pointer;color:var(--txt);transition:.15s}
.plan:hover:not(.off){border-color:var(--acc);background:#0e1420;transform:translateY(-2px)}
.plan.off{opacity:.4;cursor:not-allowed}
.plabel{font-weight:700;font-size:14px}
.pcost{font-size:12px;color:var(--acc2);font-weight:700}
.switch{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);margin:0;cursor:pointer}
.switch input{width:auto;margin:0;accent-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:24px;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:11px;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:600px}
.tbl th{text-align:left;padding:9px 11px;background:#0b0f16;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 11px;border-bottom:1px solid rgba(28,36,49,.6);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--acc2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--dim)}
.dim{color:var(--dim)}
.tag{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line2);color:var(--dim)}
.tag.live{color:var(--ok);border-color:rgba(46,204,113,.4)}
.tag.dead{color:var(--err);border-color:rgba(255,84,112,.4)}
.tag.rev{color:var(--warn);border-color:rgba(240,180,41,.4)}
.cd{font-size:12px;color:var(--acc2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.dead{color:var(--err)}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:#0a0e15;flex-wrap:wrap}
.rname{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:4px}
.rbody{border:1px solid var(--line);border-top:none;border-radius:0 0 11px 11px;padding:14px;margin:-9px 0 14px;background:#080c12}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ctl input{width:110px;flex:none;padding:7px 10px;font-size:13px}
.loglist{display:flex;flex-direction:column;gap:5px}
.logrow{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;padding:6px 9px;background:#0a0e15;border:1px solid var(--line);border-radius:8px}
.banner{padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid}
.banner.err{background:rgba(255,84,112,.09);border-color:rgba(255,84,112,.35);color:#ffb3c0}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{padding:11px 15px;border-radius:10px;background:#131a25;border:1px solid var(--line2);font-size:13px;font-weight:600;animation:in .2s ease}
.toast.ok{border-color:rgba(46,204,113,.45);color:#9df0bf}
.toast.err{border-color:rgba(255,84,112,.45);color:#ffb3c0}
.toast.out{opacity:0;transform:translateY(6px);transition:.4s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{border-top:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--dim)}
.foot .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="/">
      <span class="dot"></span>
      <span>PC5<em>Keys</em></span>
    </a>
    <nav class="nav">
      <a href="/" id="nav-reseller">Reseller</a>
      <a href="/vips" id="nav-admin">Admin</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="foot">
  <div class="wrap">
    <span>PC5 Keys · reseller gateway</span>
    <span id="footstat"></span>
  </div>
</footer>
<div id="toasts" class="toasts"></div>

<script>
(function () {
  'use strict';

  /* ================= CONFIG (hardcoded) ================= */
  var CFG = {
    KEYS_REPO:   'mranshurx/pc5-android',
    KEYS_BRANCH: 'main',
    KEYS_FILE:   'data/keys.json',

    DATA_REPO:   'mranshurx/pc5-android',
    DATA_BRANCH: 'main',
    DATA_FILE:   'data/resellers.json',

    ADMIN_PASSWORD: 'pc5admin',
    SHARED_TOKEN: '',

    KEY_PREFIX: 'PC5-',
    KEY_LEN: 6,
    KEY_ALPHABET: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789',
    ACTIVATE_ON_CREATE: true,

    PLANS: [
      { id: 'p1h',  label: '1 hour',   hours: 1,   credits: 0.5 },
      { id: 'p3h',  label: '3 hours',  hours: 3,   credits: 2   },
      { id: 'p6h',  label: '6 hours',  hours: 6,   credits: 3   },
      { id: 'p12h', label: '12 hours', hours: 12,  credits: 5   },
      { id: 'p1d',  label: '1 day',    hours: 24,  credits: 7   },
      { id: 'p3d',  label: '3 days',   hours: 72,  credits: 14  },
      { id: 'p7d',  label: '7 days',   hours: 168, credits: 25  },
      { id: 'p14d', label: '14 days',  hours: 336, credits: 30  },
      { id: 'p30d', label: '30 days',  hours: 720, credits: 80  }
    ]
  };

  /* ================= fatal error surface ================= */
  function fatal(msg) {
    var a = document.getElementById('app');
    if (!a) return;
    var d = document.createElement('div');
    d.className = 'banner err';
    d.textContent = 'Script error: ' + msg;
    a.insertBefore(d, a.firstChild);
  }
  window.addEventListener('error', function (e) { fatal(e.message); });
  window.addEventListener('unhandledrejection', function (e) {
    fatal((e.reason && e.reason.message) || 'promise rejected');
  });

  /* ================= GitHub API ================= */
  var API = 'https://api.github.com';
  function utf8ToB64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64ToUtf8(b) { return decodeURIComponent(escape(atob(String(b).replace(/\s+/g, '')))); }
  function gheaders(token) {
    var o = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (token) o['Authorization'] = 'Bearer ' + token;
    return o;
  }
  function gfail(r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      var e = new Error(j.message || ('GitHub error ' + r.status));
      e.status = r.status;
      throw e;
    });
  }
  function ghGet(repo, path, branch, token) {
    var url = API + '/repos/' + repo + '/contents/' + path +
      (branch ? '?ref=' + encodeURIComponent(branch) : '');
    return fetch(url, { headers: gheaders(token), cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) return gfail(r);
      return r.json().then(function (j) {
        return { content: b64ToUtf8(j.content || ''), sha: j.sha };
      });
    });
  }
  function ghPut(repo, path, branch, token, content, sha, message) {
    if (!token) return Promise.reject(new Error('A GitHub token is required to write.'));
    var body = { message: message || 'update', content: utf8ToB64(content) };
    if (branch) body.branch = branch;
    if (sha) body.sha = sha;
    return fetch(API + '/repos/' + repo + '/contents/' + path, {
      method: 'PUT',
      headers: Object.assign(gheaders(token), { 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    }).then(function (r) { return r.ok ? r.json() : gfail(r); });
  }
  function ghRaw(repo, path, branch) {
    return fetch('https://raw.githubusercontent.com/' + repo + '/' + branch + '/' + path +
      '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; });
  }
  function ghWho(token) {
    return fetch(API + '/user', { headers: gheaders(token) })
      .then(function (r) { return r.ok ? r.json() : gfail(r); });
  }

  /* ================= helpers ================= */
  function $(s, r) { return (r || document).querySelector(s); }
  function h(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined) return;
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) {
        if (x !== null && x !== undefined) n.appendChild(typeof x === 'string' ? document.createTextNode(x) : x);
      });
      else n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  }
  function nowISO() { return new Date().toISOString(); }
  function addHours(hh) { return new Date(Date.now() + hh * 3600000).toISOString(); }
  function fmtCredits(n) { return (Math.round(Number(n) * 100) / 100).toString(); }
  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString(undefined, {
      year: '2-digit', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  }
  function ago(iso) {
    if (!iso) return 'never';
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 0) return 'now';
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function remain(iso) {
    if (!iso) return '—';
    var ms = new Date(iso).getTime() - Date.now();
    if (ms <= 0) {
      var p = Math.floor(-ms / 1000);
      if (p < 60) return 'expired';
      if (p < 3600) return 'expired ' + Math.floor(p / 60) + 'm ago';
      if (p < 86400) return 'expired ' + Math.floor(p / 3600) + 'h ago';
      return 'expired ' + Math.floor(p / 86400) + 'd ago';
    }
    var s = Math.floor(ms / 1000);
    var d = Math.floor(s / 86400); s %= 86400;
    var hh = Math.floor(s / 3600); s %= 3600;
    var m = Math.floor(s / 60); s %= 60;
    if (d) return d + 'd ' + hh + 'h left';
    if (hh) return hh + 'h ' + m + 'm left';
    if (m) return m + 'm ' + s + 's left';
    return s + 's left';
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function randHex(n) {
    var a = new Uint8Array(n);
    crypto.getRandomValues(a);
    return Array.from(a).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function genKey() {
    var a = new Uint8Array(CFG.KEY_LEN);
    crypto.getRandomValues(a);
    var o = '';
    for (var i = 0; i < a.length; i++) o += CFG.KEY_ALPHABET[a[i] % CFG.KEY_ALPHABET.length];
    return CFG.KEY_PREFIX + o;
  }
  function planByHours(hr) {
    for (var i = 0; i < CFG.PLANS.length; i++) if (CFG.PLANS[i].hours === hr) return CFG.PLANS[i];
    return null;
  }
  function stateOf(k) {
    if (k.revoked) return { c: 'rev', t: 'Revoked' };
    if (!k.startedAt) return { c: 'idle', t: 'Not started' };
    if (k.expiresAt && new Date(k.expiresAt).getTime() <= Date.now()) return { c: 'dead', t: 'Expired' };
    return { c: 'live', t: 'Active' };
  }

  /* ================= hashing ================= */
  function hexToBytes(hex) {
    var a = new Uint8Array(hex.length / 2);
    for (var i = 0; i < a.length; i++) a[i] = parseInt(hex.substr(i * 2, 2), 16);
    return a;
  }
  function bytesToHex(buf) {
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function sha256Fallback(str) {
    function rr(v, n) { return (v >>> n) | (v << (32 - n)); }
    var K = [], H = [], primes = [], n = 2, i;
    while (primes.length < 64) {
      var isP = true;
      for (var d = 2; d * d <= n; d++) if (n % d === 0) { isP = false; break; }
      if (isP) primes.push(n);
      n++;
    }
    for (i = 0; i < 64; i++) K[i] = (Math.pow(primes[i], 1 / 3) % 1 * 4294967296) | 0;
    for (i = 0; i < 8; i++) H[i] = (Math.pow(primes[i], 1 / 2) % 1 * 4294967296) | 0;
    var bytes = new TextEncoder().encode(str);
    var bitLen = bytes.length * 8;
    var padded = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
    padded.set(bytes); padded[bytes.length] = 0x80;
    for (i = 0; i < 8; i++) padded[padded.length - 1 - i] = (bitLen >>> (8 * i)) & 0xff;
    for (var off = 0; off < padded.length; off += 64) {
      var w = [];
      for (i = 0; i < 16; i++) w[i] = (padded[off + i * 4] << 24) | (padded[off + i * 4 + 1] << 16) | (padded[off + i * 4 + 2] << 8) | padded[off + i * 4 + 3];
      for (i = 16; i < 64; i++) {
        var s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        var s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], dd = H[3], e = H[4], f = H[5], g = H[6], hh = H[7];
      for (i = 0; i < 64; i++) {
        var S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
        var S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
        var mj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + mj) | 0;
        hh = g; g = f; f = e; e = (dd + t1) | 0;
        dd = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + dd) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + hh) | 0;
    }
    var out = '';
    for (i = 0; i < 8; i++) out += (H[i] >>> 0).toString(16).padStart(8, '0');
    return out;
  }
  async function hashPass(pass, saltHex) {
    if (!(window.crypto && crypto.subtle && crypto.subtle.importKey)) {
      var acc = saltHex + ':' + pass;
      for (var i = 0; i < 5000; i++) acc = sha256Fallback(acc + ':' + i);
      return 'fb$' + acc;
    }
    var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: hexToBytes(saltHex), iterations: 120000, hash: 'SHA-256' }, key, 256);
    return bytesToHex(bits);
  }

  /* ================= state ================= */
  var S = {
    view: 'reseller', busy: false, me: null, data: { resellers: [] },
    admin: false, adminToken: localStorage.getItem('pc5_admin_token') || '',
    expanded: {}, activateOnCreate: CFG.ACTIVATE_ON_CREATE
  };
  var SESSION_KEY = 'pc5_session';

  function toast(msg, kind) {
    var t = h('div', { class: 'toast ' + (kind || ''), text: msg });
    $('#toasts').appendChild(t);
    setTimeout(function () { t.classList.add('out'); }, 3200);
    setTimeout(function () { t.remove(); }, 3800);
  }
  function setBusy(v) { S.busy = v; document.body.classList.toggle('busy', v); }
  function writerToken() { return (S.me && S.me.ghToken) || S.adminToken || CFG.SHARED_TOKEN || ''; }

  /* ================= storage ================= */
  async function loadResellers() {
    var res = null;
    if (S.adminToken) {
      try {
        var f = await ghGet(CFG.DATA_REPO, CFG.DATA_FILE, CFG.DATA_BRANCH, S.adminToken);
        res = f ? JSON.parse(f.content) : null;
      } catch (e) { res = null; }
    }
    if (!res) {
      var raw = await ghRaw(CFG.DATA_REPO, CFG.DATA_FILE, CFG.DATA_BRANCH);
      res = raw ? JSON.parse(raw) : null;
    }
    if (!res || !Array.isArray(res.resellers)) res = { resellers: [] };
    S.data = res;
    return res;
  }
  async function saveResellers(mutator, token) {
    var tok = token || writerToken();
    if (!tok) throw new Error('No write token available.');
    for (var a = 0; a < 4; a++) {
      var f = await ghGet(CFG.DATA_REPO, CFG.DATA_FILE, CFG.DATA_BRANCH, tok);
      var data = f && f.content ? JSON.parse(f.content) : { resellers: [] };
      if (!Array.isArray(data.resellers)) data.resellers = [];
      mutator(data);
      try {
        await ghPut(CFG.DATA_REPO, CFG.DATA_FILE, CFG.DATA_BRANCH, tok,
          JSON.stringify(data, null, 2), f ? f.sha : null, 'reseller: update');
        S.data = data;
        return data;
      } catch (e) {
        if (e.status !== 409 && e.status !== 422) throw e;
        await sleep(400 * (a + 1));
      }
    }
    throw new Error('Write conflict, retry.');
  }
  async function saveKeys(mutator, token) {
    if (!token) throw new Error('Add your GitHub token first.');
    for (var a = 0; a < 4; a++) {
      var f = await ghGet(CFG.KEYS_REPO, CFG.KEYS_FILE, CFG.KEYS_BRANCH, token);
      var db = f && f.content ? JSON.parse(f.content)
        : { keys: [], maintenance: { enabled: false, message: '' } };
      if (!Array.isArray(db.keys)) db.keys = [];
      if (!db.maintenance) db.maintenance = { enabled: false, message: '' };
      mutator(db);
      try {
        await ghPut(CFG.KEYS_REPO, CFG.KEYS_FILE, CFG.KEYS_BRANCH, token,
          JSON.stringify(db, null, 2), f ? f.sha : null, 'keys: issue via reseller panel');
        return db;
      } catch (e) {
        if (e.status !== 409 && e.status !== 422) throw e;
        await sleep(400 * (a + 1));
      }
    }
    throw new Error('Write conflict, retry.');
  }
  function findMe() {
    var s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s) return null;
    return S.data.resellers.find(function (r) { return r.id === s.id; }) || null;
  }

  /* ================= router ================= */
  function route() {
    var sig = (location.pathname + location.search + location.hash).toLowerCase();
    var isAdmin = /\/vips(\/|$|\?|#)/.test(sig) || /[?&]p=vips/.test(sig) || /#vips/.test(sig);
    S.view = isAdmin ? 'admin' : 'reseller';
    render();
  }

  /* ================= auth ================= */
  async function doRegister(ev) {
    ev.preventDefault();
    var username = $('#r-user').value.trim().toLowerCase();
    var pass = $('#r-pass').value;
    var pass2 = $('#r-pass2').value;
    var ghTok = $('#r-token').value.trim();
    if (!/^[a-z0-9_-]{3,24}$/.test(username)) return toast('Username: 3-24 chars, a-z 0-9 _ -', 'err');
    if (pass.length < 6) return toast('Password needs 6+ characters', 'err');
    if (pass !== pass2) return toast('Passwords do not match', 'err');
    var writer = ghTok || CFG.SHARED_TOKEN;
    if (!writer) return toast('Registration closed: no write token configured.', 'err');
    setBusy(true);
    try {
      var salt = randHex(16);
      var rec = {
        id: 'R-' + randHex(5), username: username, salt: salt,
        passHash: await hashPass(pass, salt), credits: 0,
        createdAt: nowISO(), lastLogin: null, lastSeen: null,
        ghToken: ghTok, status: 'active', logins: [], keys: []
      };
      await saveResellers(function (d) {
        if (d.resellers.some(function (x) { return x.username === username; })) throw new Error('Username already taken');
        d.resellers.push(rec);
      }, writer);
      localStorage.setItem(SESSION_KEY, JSON.stringify({ id: rec.id }));
      S.me = rec;
      toast('Account created — ask the owner for credits.', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }

  async function doLogin(ev) {
    ev.preventDefault();
    var username = $('#l-user').value.trim().toLowerCase();
    var pass = $('#l-pass').value;
    if (!username || !pass) return toast('Fill both fields', 'err');
    setBusy(true);
    try {
      await loadResellers();
      var rec = S.data.resellers.find(function (r) { return r.username === username; });
      if (!rec) return toast('No such reseller', 'err');
      if (rec.status === 'banned') return toast('Account banned', 'err');
      if (await hashPass(pass, rec.salt) !== rec.passHash) return toast('Wrong password', 'err');
      var ip = '';
      try {
        var r = await Promise.race([
          fetch('https://api.ipify.org?format=json').then(function (x) { return x.json(); }),
          sleep(3000).then(function () { return null; })
        ]);
        ip = (r && r.ip) || '';
      } catch (e) { ip = ''; }
      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === rec.id; });
        if (!t) return;
        t.lastLogin = nowISO(); t.lastSeen = nowISO();
        t.logins = (t.logins || []).slice(0, 49);
        t.logins.unshift({ at: nowISO(), ip: ip, ua: navigator.userAgent.slice(0, 180) });
      }, rec.ghToken || CFG.SHARED_TOKEN || S.adminToken);
      localStorage.setItem(SESSION_KEY, JSON.stringify({ id: rec.id }));
      S.me = S.data.resellers.find(function (x) { return x.id === rec.id; });
      toast('Welcome back, ' + rec.username, 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    S.me = null;
    render();
  }

  async function saveMyToken(ev) {
    ev.preventDefault();
    var tok = $('#tk').value.trim();
    if (!tok) return toast('Paste a token', 'err');
    setBusy(true);
    try {
      var who = await ghWho(tok);
      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === S.me.id; });
        if (t) t.ghToken = tok;
      }, tok);
      S.me.ghToken = tok;
      toast('Token saved for ' + who.login, 'ok');
      render();
    } catch (e) { toast('Token rejected: ' + e.message, 'err'); }
    finally { setBusy(false); }
  }

  async function issueKey(plan, unlimited) {
    if (S.busy || !S.me) return;
    var tok = S.me.ghToken;
    if (!tok) return toast('Add your GitHub token first', 'err');
    if (S.me.status === 'banned') return toast('Account banned', 'err');
    if (Number(S.me.credits) < plan.credits) return toast('Not enough credits', 'err');
    setBusy(true);
    var made = null;
    try {
      await saveKeys(function (db) {
        var k, guard = 0;
        do { k = genKey(); guard++; }
        while (db.keys.some(function (x) { return x.key === k; }) && guard < 40);
        var created = nowISO();
        var start = S.activateOnCreate ? created : null;
        var rec = {
          key: k, durationHours: plan.hours,
          maxDevices: unlimited ? 0 : 1,
          deviceLimit: unlimited ? 'unlimited' : 'single',
          devices: [], createdAt: created,
          startedAt: start, activatedAt: start,
          expiresAt: start ? addHours(plan.hours) : null
        };
        db.keys.unshift(rec);
        made = rec;
      }, tok);

      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === S.me.id; });
        if (!t) return;
        t.credits = Math.max(0, Math.round((Number(t.credits) - plan.credits) * 100) / 100);
        t.keys = t.keys || [];
        t.keys.unshift({
          key: made.key, durationHours: plan.hours, credits: plan.credits,
          unlimited: !!unlimited, createdAt: made.createdAt,
          startedAt: made.startedAt, expiresAt: made.expiresAt, revoked: false
        });
      }, tok);

      S.me = S.data.resellers.find(function (x) { return x.id === S.me.id; });
      toast('Key minted: ' + made.key, 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }

  function copy(t) {
    navigator.clipboard.writeText(t).then(
      function () { toast('Copied', 'ok'); },
      function () { toast('Copy failed', 'err'); }
    );
  }

  async function addCredits(id, mode) {
    var val = parseFloat($('#cr-' + id).value);
    if (isNaN(val)) return toast('Enter a number', 'err');
    if (!S.adminToken && !CFG.SHARED_TOKEN) return toast('Set an admin token first', 'err');
    setBusy(true);
    try {
      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === id; });
        if (!t) return;
        var base = Number(t.credits) || 0;
        var next = mode === 'set' ? val : base + val;
        t.credits = Math.max(0, Math.round(next * 100) / 100);
      });
      toast('Credits updated', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }
  async function toggleBan(id) {
    setBusy(true);
    try {
      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === id; });
        if (t) t.status = t.status === 'banned' ? 'active' : 'banned';
      });
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }
  async function resetPass(id) {
    var np = prompt('New password (6+ chars):');
    if (!np || np.length < 6) return toast('Cancelled or too short', 'err');
    setBusy(true);
    try {
      var salt = randHex(16);
      var hash = await hashPass(np, salt);
      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === id; });
        if (t) { t.salt = salt; t.passHash = hash; }
      });
      toast('Password reset', 'ok');
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }
  async function deleteReseller(id, username) {
    if (!confirm('Delete reseller "' + username + '"? Key log is removed too.')) return;
    setBusy(true);
    try {
      await saveResellers(function (d) {
        d.resellers = d.resellers.filter(function (x) { return x.id !== id; });
      });
      toast('Reseller deleted', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }
  async function revokeKey(ownerId, key) {
    var tok = S.adminToken || CFG.SHARED_TOKEN;
    if (!tok) return toast('Set an admin token first', 'err');
    if (!confirm('Revoke ' + key + '? It is deleted from the license database.')) return;
    setBusy(true);
    try {
      await saveKeys(function (db) {
        db.keys = db.keys.filter(function (x) { return x.key !== key; });
      }, tok);
      await saveResellers(function (d) {
        var t = d.resellers.find(function (x) { return x.id === ownerId; });
        if (!t) return;
        (t.keys || []).forEach(function (k) { if (k.key === key) k.revoked = true; });
      }, tok);
      toast('Key revoked', 'ok');
      render();
    } catch (e) { toast(e.message, 'err'); }
    finally { setBusy(false); }
  }

            h('span', { text: 'joined ' + ago(r.createdAt) }),
            h('span', { text: '· last login ' + ago(r.lastLogin) }),
            h('span', { text: '· seen ' + ago(r.lastSeen) }),
            lastLog ? h('span', { text: '· ip ' + (lastLog.ip || 'n/a') }) : null
          )
        ),
        h('button', {
          class: 'btn tiny',
          onclick: function () { S.expanded[r.id] = !open; render(); },
          text: open ? 'Hide' : 'Open'
        })
      ));

      if (open) {
        var body = h('div', { class: 'rbody' });
        body.appendChild(h('div', { class: 'ctl' },
          h('input', { id: 'cr-' + r.id, type: 'number', step: '0.5', min: '0', placeholder: 'credits' }),
          h('button', { class: 'btn tiny primary', onclick: function () { addCredits(r.id, 'add'); }, text: 'Add' }),
          h('button', { class: 'btn tiny', onclick: function () { addCredits(r.id, 'set'); }, text: 'Set exact' }),
          h('button', { class: 'btn tiny', onclick: function () { toggleBan(r.id); }, text: r.status === 'banned' ? 'Unban' : 'Ban' }),
          h('button', { class: 'btn tiny', onclick: function () { resetPass(r.id); }, text: 'Reset pass' }),
          h('button', { class: 'btn tiny danger', onclick: function () { deleteReseller(r.id, r.username); }, text: 'Delete' })
        ));
        body.appendChild(h('p', { class: 'sub mono', text: 'token: ' + (r.ghToken ? r.ghToken.slice(0, 12) + '…' + r.ghToken.slice(-4) : 'none') }));

        if (kcount) {
          var kt = h('table', { class: 'tbl' },
            h('thead', {}, h('tr', {},
              h('th', { text: 'Key' }), h('th', { text: 'Plan' }), h('th', { text: 'Cost' }),
              h('th', { text: 'Created' }), h('th', { text: 'Expiry' }), h('th', { text: '' })
            ))
          );
          var ktb = h('tbody');
          r.keys.slice().reverse().forEach(function (k) {
            var st = stateOf(k);
            ktb.appendChild(h('tr', {},
              h('td', {}, h('code', { text: k.key }), h('span', { class: 'tag ' + st.c, text: st.t })),
              h('td', { text: (planByHours(k.durationHours) || { label: k.durationHours + 'h' }).label }),
              h('td', { text: fmtCredits(k.credits) }),
              h('td', { text: ago(k.createdAt) }),
              h('td', {}, h('span', {
                class: 'cd',
                'data-exp': k.expiresAt || null,
                text: k.expiresAt ? remain(k.expiresAt) : 'not started'
              })),
              h('td', {}, k.revoked
                ? h('span', { class: 'dim', text: 'revoked' })
                : h('button', { class: 'btn tiny danger', onclick: function () { revokeKey(r.id, k.key); }, text: 'Revoke' }))
            ));
          });
          kt.appendChild(ktb);
          body.appendChild(h('div', { class: 'scroll' }, kt));
        } else body.appendChild(h('p', { class: 'sub', text: 'No keys minted.' }));

        if (r.logins && r.logins.length) {
          var lg = h('div', { class: 'loglist' });
          r.logins.slice(0, 8).forEach(function (l) {
            lg.appendChild(h('div', { class: 'logrow' },
              h('span', { text: fmtDate(l.at) }),
              h('span', { class: 'mono', text: l.ip || 'no-ip' }),
              h('span', { class: 'dim', text: (l.ua || '').slice(0, 60) })
            ));
          });
          body.appendChild(h('h3', { text: 'Recent logins' }));
          body.appendChild(lg);
        }
        card.appendChild(body);
      }
    });
    app.appendChild(card);
  }

  function tick() {
    document.querySelectorAll('[data-exp]').forEach(function (el) {
      var iso = el.getAttribute('data-exp');
      if (!iso) return;
      el.textContent = remain(iso);
      el.classList.toggle('dead', new Date(iso).getTime() <= Date.now());
    });
  }

  /* ================= boot ================= */
  async function boot() {
    try {
      await loadResellers();
      S.me = findMe();
    } catch (e) { /* first paint still renders */ }
    if (localStorage.getItem('pc5_admin') === '1') S.admin = true;
    route();
    setInterval(tick, 1000);
    setInterval(function () {
      if (S.admin) refreshAdmin();
      else if (S.me) loadResellers().then(function () {
        var f = S.data.resellers.find(function (x) { return x.id === S.me.id; });
        if (f) S.me = f;
      }).catch(function () {});
    }, 20000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
